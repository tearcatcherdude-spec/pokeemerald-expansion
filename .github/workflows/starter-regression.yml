name: Starter regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/starter_choose*.c'
      - 'src/battle_setup.c'
      - 'test/starter_choose.c'
      - '.github/workflows/starter-regression.yml'

jobs:
  starter-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 1
      DEPRECATED_ERROR: 1
      TEST: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Check starter selection and rescue transitions
        run: make -j$(nproc) check TESTS=test/starter_choose.c TEST_SRCS="$(find test -maxdepth 1 -name '*.c' -print)"
